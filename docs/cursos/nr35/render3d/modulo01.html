  let s=SC[0];for(const q of SC)if(t>=q.t0)s=q;

  const a=s.sh[i], b=s.sh[i+1], span=(b?b.t:s.dur)-a.t;
  const u=ease(Math.min(1,(ct-a.t)/Math.max(.001,span)));
  cam.position.lerpVectors(a.c[0],a.c[1],u);
  cam.lookAt(new THREE.Vector3().lerpVectors(a.c[2],a.c[3],u));

  let na=null;s.nar.forEach(n=>{if(lt>=n.t&&lt<n.t+n.dur+.7)na=n;});
  legenda(na); vinheta();

  oc.drawImage(gl,0,0);oc.filter='none';oc.drawImage(ov,0,0);
};
