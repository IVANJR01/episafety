<html lang="pt-BR">

    <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://generativelanguage.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:;" />
    <title>SafetySoluções - Segurança do Trabalho</title>
    <meta name="description" content="Sistema de gestão de EPIs e segurança do trabalho">
    <meta name="author" content="SafetySoluções" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SafetySoluções" />
    <!--
      O ?v= existe porque iOS e Android guardam o ícone do app instalado com
      cache agressivo. Sem ele, quem já tinha o atalho na tela inicial
      continuaria vendo o ícone antigo mesmo depois da troca do arquivo.
      Ao trocar a arte de novo, incremente o número.
    -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://safetysolucoes.com/pwa-512x512.png?v=2">
    <meta property="og:url" content="https://safetysolucoes.com">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://safetysolucoes.com/pwa-512x512.png?v=2">
    
    
    
    
    
  
  
  
  
  
  
  
  
  
  
  
  <meta property="og:title" content="SafetySoluções - Segurança do Trabalho">
  <meta name="twitter:title" content="SafetySoluções - Segurança do Trabalho">
  <meta property="og:description" content="Sistema de gestão de EPIs e segurança do trabalho">
  <meta name="twitter:description" content="Sistema de gestão de EPIs e segurança do trabalho">
</head>

  <body>
    <div id="root"></div>

    <!--
      Rede de segurança contra a página em branco.

      Os arquivos em /assets levam hash no nome e cache de um ano. Se o
      navegador (ou o service worker) guardar um index.html antigo, ele vai
      pedir um arquivo que a publicação seguinte já apagou: o pedido volta 404,
      nada é montado e a tela fica branca do jeito que estava — sem mensagem
      nenhuma, porque nem o React chegou a subir para poder avisar.

      Este trecho é HTML puro, roda antes de tudo e não depende de nada:
      percebe a falha, limpa cache e service workers e recarrega UMA vez. Se
      mesmo assim não subir, escreve o que houve na tela em vez de deixar em
      branco.
    -->
    <script>
      (function () {
        var CHAVE = "recuperacao-tela-branca";
        var raiz = document.getElementById("root");

        function recuperar(motivo) {
          // Uma tentativa por sessão — recarregar em laço seria pior que a falha.
          if (sessionStorage.getItem(CHAVE)) { avisar(motivo); return; }
          sessionStorage.setItem(CHAVE, motivo);
          var tarefas = [];
          if (window.caches) {
            tarefas.push(caches.keys().then(function (ns) {
              return Promise.all(ns.map(function (n) { return caches.delete(n); }));
            }));
          }
          if (navigator.serviceWorker) {
            tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(tarefas)["catch"](function () {})["then"](function () {
            var u = new URL(location.href);
            u.searchParams.set("recuperar", String(Date.now()));
            location.replace(u.toString());
          });
        }

        function avisar(motivo) {
          if (!raiz) return;
          raiz.style.display = 'none';
          document.body.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:34rem;margin:15vh auto;padding:1.5rem;' +
            'border:1px solid #e5e5e5;border-radius:12px;line-height:1.5">' +
            '<h1 style="font-size:1.2rem;margin:0 0 .5rem;color:#1A1A1A;">Atualização Concluída!</h1>' +
            '<p style="margin:0 0 1rem;color:#666;font-size:.95rem">Nós acabamos de enviar melhorias para o sistema enquanto você navegava. ' +
            'Para garantir o funcionamento perfeito com a nova versão, por favor recarregue a tela.</p>' +
            '<button onclick="sessionStorage.clear();location.reload(true)" ' +
            'style="padding:.6rem 1rem;border-radius:8px;border:none;background:#1A1A1A;color:#fff;font-weight:500;cursor:pointer">' +
            'Recarregar Sistema</button></div>';
        }

        // Falha ao baixar o próprio código do aplicativo.
        window.addEventListener("error", function (e) {
          var alvo = e.target;
          if (alvo && alvo.tagName === "SCRIPT" && String(alvo.src || "").indexOf("/assets/") > -1) {
            recuperar("arquivo do aplicativo nao carregou");
          }
        }, true);

        window.addEventListener("load", function () {
          // Estilo que não carregou. A página ABRE sem ele — por isso a
          // checagem de "tela vazia" não pega — mas sai toda desmontada, com o
          // logo em tamanho natural ocupando tudo e o resto empurrado para
          // baixo. Foi exatamente o que apareceu.
          //
          // A verificação é a folha ter REGRAS. Os dois sinais mais óbvios
          // foram medidos e não servem: o evento de erro do elemento chega a
          // disparar para um CSS que carregou inteiro (reagir a ele
          // recarregaria a página de todo mundo sem motivo), e `link.sheet`
          // continua preenchido mesmo quando o arquivo volta 404. Já a
          // contagem de regras separa os casos sem ambiguidade — o estilo do
          // sistema tem mais de mil, o que falhou tem zero.
          var estilos = document.querySelectorAll('link[rel="stylesheet"]');
          for (var i = 0; i < estilos.length; i++) {
            var l = estilos[i];
            if (String(l.href || "").indexOf("/assets/") === -1) continue;
            var regras = -1;
            try { regras = l.sheet ? l.sheet.cssRules.length : 0; } catch (err) { regras = -1; }
            if (regras === 0) { recuperar("estilo nao carregou"); return; }
          }

          // Ou tudo baixou e mesmo assim nada foi montado.
          setTimeout(function () {
            if (raiz && raiz.childElementCount === 0) recuperar("tela vazia");
            else sessionStorage.removeItem(CHAVE);
          }, 8000);
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
